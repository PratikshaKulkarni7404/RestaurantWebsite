name: Restaurant Website CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  ci:
    runs-on: ubuntu-latest
    name: Build Website

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Tools
        run: |
          npm init -y
          npm install htmlhint --save-dev

      - name: Run HTML Check (Non-blocking)
        run: npx htmlhint "**/*.html" || true

      - name: Build Step
        run: echo "Build successful!"

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    runs-on: ubuntu-latest
    needs: ci
    name: Deploy Website

    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
