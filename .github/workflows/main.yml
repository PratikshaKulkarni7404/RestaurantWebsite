name: Restaurant Website CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:

  # ======================
  # CI JOB - Build & Test
  # ======================
  ci:
    name: Continuous Integration (Build & Test)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Dependencies
        run: |
          npm init -y
          npm install htmlhint stylelint eslint --save-dev

      - name: Run HTML Lint
        run: npx htmlhint "**/*.html"

      - name: Run CSS Lint
        run: npx stylelint "**/*.css"

      - name: Run JavaScript Lint
        run: npx eslint "**/*.js" || true

      - name: Build Project (Static Site)
        run: |
          echo "Build completed successfully!"

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  # ======================
  # CD JOB - Deploy
  # ======================
  cd:
    name: Continuous Deployment (GitHub Pages)
    needs: ci
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
